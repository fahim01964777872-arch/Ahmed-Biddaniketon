<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - Ahmed Biddaniketon</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f5f9;
    margin:0;
}

.header{
    background:#0b5ed7;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

button{
    background:#dc3545;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#bb2d3b;
}
</style>

</head>

<body>

<div class="header">
<h2>Ahmed Biddaniketon Admin Panel</h2>
</div>


<div class="container">

<div class="card">
<h3>Welcome Admin 👋</h3>
<p>এখান থেকে স্কুলের তথ্য নিয়ন্ত্রণ করা যাবে।</p>
</div>


<div class="card">
<h3>নতুন নোটিশ যোগ করুন</h3>

<input id="noticeTitle" placeholder="নোটিশ লিখুন" style="width:100%;padding:10px;">

<br><br>

<button id="addNoticeBtn">Add Notice</button>

<p id="noticeMsg"></p>

</div>


<div class="card">

<h3>🖼️ নতুন ছবি যোগ করুন</h3>

<input id="imageName" placeholder="ছবির নাম লিখুন (যেমন school1.jpg)" style="width:100%;padding:10px;">

<br><br>

<button id="addImageBtn">Add Image</button>

<p id="imageMsg"></p>

</div>

<div class="card">

<h3>👨‍🏫 নতুন শিক্ষক যোগ করুন</h3>

<input id="teacherName" placeholder="শিক্ষকের নাম" style="width:100%;padding:10px;">

<br><br>

<input id="teacherRole" placeholder="পদবি (যেমন: সহকারী শিক্ষক)" style="width:100%;padding:10px;">

<br><br>

<button id="addTeacherBtn">Add Teacher</button>

<p id="teacherMsg"></p>

</div>
<div class="card">
<button id="logoutBtn">Logout</button>
</div>


</div>


<script type="module">

import { auth,db } from "./firebase.js";
import { signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
document.getElementById("addNoticeBtn").addEventListener("click", async()=>{

const title = document.getElementById("noticeTitle").value;

if(title==""){
alert("Notice লিখুন");
return;
}

await addDoc(collection(db,"notices"),{
notice:title,
date:serverTimestamp()
});

alert("Notice Added Successfully");

document.getElementById("noticeTitle").value="";

});


document.getElementById("addImageBtn").addEventListener("click", async()=>{

const imageName = document.getElementById("imageName").value;

if(imageName==""){
alert("ছবির নাম লিখুন");
return;
}

await addDoc(collection(db,"gallery"),{
image:imageName,
date:serverTimestamp()
});
document.getElementById("addTeacherBtn").addEventListener("click", async()=>{

const name = document.getElementById("teacherName").value;
const role = document.getElementById("teacherRole").value;

if(name=="" || role==""){
alert("সব তথ্য লিখুন");
return;
}

await addDoc(collection(db,"teachers"),{
name:name,
role:role,
date:serverTimestamp()
});

alert("Teacher Added Successfully");

document.getElementById("teacherName").value="";
document.getElementById("teacherRole").value="";

});
alert("Image Added Successfully");

document.getElementById("imageName").value="";

});
document.getElementById("logoutBtn").addEventListener("click",()=>{

signOut(auth).then(()=>{
alert("Logout Successful");
window.location.href="admin.html";
});

});


</script>


</body>
</html>
