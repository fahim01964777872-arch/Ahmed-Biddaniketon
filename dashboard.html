<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - Ahmed Biddaniketon</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f5f9;
    margin:0;
}

.header{
    background:#0b5ed7;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

button{
    background:#dc3545;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#bb2d3b;
}
</style>

</head>

<body>

<div class="header">
<h2>Ahmed Biddaniketon Admin Panel</h2>
</div>


<div class="container">

<div class="card">
<h3>Welcome Admin 👋</h3>
<p>এখান থেকে স্কুলের তথ্য নিয়ন্ত্রণ করা যাবে।</p>
</div>


<div class="card">

<h3>নতুন নোটিশ যোগ করুন</h3>

<input id="noticeTitle" placeholder="নোটিশের শিরোনাম (যেমন: ২য় সাময়িক পরীক্ষার সময়সূচি)" style="width:100%;padding:10px;">

<br><br>

<textarea id="noticeDetails" placeholder="বিস্তারিত নোটিশ লিখুন" style="width:100%;padding:10px;height:120px;"></textarea>

<br><br>

<button id="addNoticeBtn">Add Notice</button>
<p id="noticeMsg"></p>
<hr>

<h3>📋 সকল নোটিশ</h3>

<div id="noticeAdminList">

<p>নোটিশ লোড হচ্ছে...</p>

</div>
</div>


<div class="card">

<h3>🖼️ নতুন ছবি যোগ করুন</h3>

<input id="imageName" placeholder="ছবির নাম লিখুন (যেমন school1.jpg)" style="width:100%;padding:10px;">

<br><br>

<button id="addImageBtn">Add Image</button>

<p id="imageMsg"></p>
<hr>

<h3>🖼️ সকল ছবি</h3>

<div id="galleryAdminList">

<p>ছবি লোড হচ্ছে...</p>

</div>
</div>

<div class="card">

<h3>👨‍🏫 নতুন শিক্ষক যোগ করুন</h3>

<input id="teacherName" placeholder="শিক্ষকের নাম" style="width:100%;padding:10px;">

<br><br>

<input id="teacherRole" placeholder="পদবি (যেমন: সহকারী শিক্ষক)" style="width:100%;padding:10px;">

<br><br>

<button id="addTeacherBtn">Add Teacher</button>

<p id="teacherMsg"></p>
<hr>

<h3>👨‍🏫 সকল শিক্ষক</h3>

<div id="teacherAdminList">

<p>শিক্ষক লোড হচ্ছে...</p>
</div>
</div>
<div class="card">

<h3>👤 Founder তথ্য</h3>

<input id="founderImage" placeholder="ছবির নাম (যেমন founder.jpg)" style="width:100%;padding:10px;">

<br><br>

<input id="founderName" placeholder="প্রতিষ্ঠাতার নাম" style="width:100%;padding:10px;">

<br><br>

<textarea id="founderMessage" placeholder="প্রতিষ্ঠাতার বক্তব্য" style="width:100%;padding:10px;height:120px;"></textarea>

<br><br>

<button id="saveFounderBtn">Save Founder</button>

<p id="founderMsg"></p>

</div>
<div class="card">
<button id="logoutBtn">Logout</button>
</div>


</div>


<script type="module">

import { auth,db } from "./firebase.js";
import { signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
collection,
addDoc,
serverTimestamp,
getDocs,
deleteDoc,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
document.getElementById("addNoticeBtn").addEventListener("click", async()=>{

const title = document.getElementById("noticeTitle").value;
const details = document.getElementById("noticeDetails").value;

if(title=="" || details==""){
alert("সব তথ্য লিখুন");
return;
}

await addDoc(collection(db,"notices"),{
title:title,
details:details,
date:serverTimestamp()
});

alert("Notice Added Successfully");

document.getElementById("noticeTitle").value="";

loadNotices();

});


document.getElementById("addImageBtn").addEventListener("click", async()=>{

const imageName = document.getElementById("imageName").value;

if(imageName==""){
alert("ছবির নাম লিখুন");
return;
}

await addDoc(collection(db,"gallery"),{
image:imageName,
date:serverTimestamp()
});

alert("Image Added Successfully");

document.getElementById("imageName").value="";

loadGallery();

});


document.getElementById("addTeacherBtn").addEventListener("click", async()=>{

const name = document.getElementById("teacherName").value;
const role = document.getElementById("teacherRole").value;

if(name=="" || role==""){
alert("সব তথ্য লিখুন");
return;
}

await addDoc(collection(db,"teachers"),{
name:name,
role:role,
date:serverTimestamp()
});

alert("Teacher Added Successfully");

document.getElementById("teacherName").value="";
document.getElementById("teacherRole").value="";

loadTeachers();

});
const noticeAdminList = document.getElementById("noticeAdminList");

async function loadNotices(){

const snapshot = await getDocs(collection(db,"notices"));

noticeAdminList.innerHTML = "";

snapshot.forEach((noticeDoc)=>{

const data = noticeDoc.data();

noticeAdminList.innerHTML += `
<div style="border:1px solid #ddd;padding:10px;margin:10px 0;border-radius:8px;">
<p>${data.title}</p>
<button class="edit-btn"
data-id="${noticeDoc.id}"
data-notice="${data.title}"
✏️ Edit
</button>

<button class="delete-btn"
data-id="${noticeDoc.id}">
🗑️ Delete
</button>
</div>
`;

});
document.querySelectorAll(".edit-btn").forEach(btn=>{

btn.addEventListener("click", async()=>{

const newNotice = prompt("নতুন নোটিশ লিখুন", btn.dataset.notice);

if(newNotice==null || newNotice=="") return;

await updateDoc(doc(db,"notices",btn.dataset.id),{
title:newNotice
});

alert("Notice Updated Successfully");

loadNotices();

});

});
document.querySelectorAll(".delete-btn").forEach(btn=>{

btn.addEventListener("click", async()=>{

if(!confirm("নোটিশটি মুছে ফেলবেন?")) return;

await deleteDoc(doc(db,"notices",btn.dataset.id));

loadNotices();

});

});

}

loadNotices();
const galleryAdminList = document.getElementById("galleryAdminList");

async function loadGallery(){

const snapshot = await getDocs(collection(db,"gallery"));

galleryAdminList.innerHTML = "";

snapshot.forEach((imageDoc)=>{

const data = imageDoc.data();

galleryAdminList.innerHTML += `
<div style="border:1px solid #ddd;padding:10px;margin:10px 0;border-radius:8px;">
<p>${data.image}</p>
<button class="deleteImageBtn" data-id="${imageDoc.id}">🗑️ Delete</button>
</div>
`;

});

document.querySelectorAll(".deleteImageBtn").forEach(btn=>{

btn.addEventListener("click", async()=>{

if(!confirm("ছবিটি মুছে ফেলবেন?")) return;

await deleteDoc(doc(db,"gallery",btn.dataset.id));

loadGallery();

});

});

}

loadGallery();
const teacherAdminList = document.getElementById("teacherAdminList");

async function loadTeachers(){

const snapshot = await getDocs(collection(db,"teachers"));

teacherAdminList.innerHTML = "";

snapshot.forEach((teacherDoc)=>{

const data = teacherDoc.data();

teacherAdminList.innerHTML += `
<div style="border:1px solid #ddd;padding:10px;margin:10px 0;border-radius:8px;">
<p><b>${data.name}</b></p>
<p>${data.role}</p>

<button class="editTeacherBtn"
data-id="${teacherDoc.id}"
data-name="${data.name}"
data-role="${data.role}">
✏️ Edit
</button>

<button class="deleteTeacherBtn"
data-id="${teacherDoc.id}">
🗑️ Delete
</button>

</div>
`;
});
document.querySelectorAll(".editTeacherBtn").forEach(btn=>{

btn.addEventListener("click", async()=>{

const newName = prompt("শিক্ষকের নাম", btn.dataset.name);

if(newName==null || newName=="") return;

const newRole = prompt("পদবি", btn.dataset.role);

if(newRole==null || newRole=="") return;

await updateDoc(doc(db,"teachers",btn.dataset.id),{
name:newName,
role:newRole
});

alert("Teacher Updated Successfully");

loadTeachers();

});

});
document.querySelectorAll(".deleteTeacherBtn").forEach(btn=>{

btn.addEventListener("click", async()=>{

if(!confirm("শিক্ষককে মুছে ফেলবেন?")) return;

await deleteDoc(doc(db,"teachers",btn.dataset.id));

loadTeachers();

});

});

}

loadTeachers();
document.getElementById("saveFounderBtn").addEventListener("click", async()=>{

const image = document.getElementById("founderImage").value;
const name = document.getElementById("founderName").value;
const message = document.getElementById("founderMessage").value;

if(image=="" || name=="" || message==""){
alert("সব তথ্য লিখুন");
return;
}

await addDoc(collection(db,"founder"),{
image:image,
name:name,
message:message,
date:serverTimestamp()
});

alert("Founder Saved Successfully");
document.getElementById("founderImage").value="";
document.getElementById("founderName").value="";
document.getElementById("founderMessage").value="";

});
document.getElementById("logoutBtn").addEventListener("click",()=>{

signOut(auth).then(()=>{
alert("Logout Successful");
window.location.href="admin.html";
});

});


</script>


</body>
</html>
